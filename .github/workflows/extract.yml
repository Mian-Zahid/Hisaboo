name: Extract Hisaboo source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip
        run: |
          unzip -l hisaboo-github-ready-v1.2.zip
          mkdir -p extracted
          unzip -o hisaboo-github-ready-v1.2.zip -d extracted
          TOP=$(find extracted -mindepth 1 -maxdepth 1)
          COUNT=$(echo "$TOP" | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -d "$TOP" ]; then SRC="$TOP"; else SRC="extracted"; fi
          echo "Source dir: $SRC"
          rsync -a "$SRC"/ ./
          rm -rf extracted
          rm -f .github/workflows/android.yml
          
          rm -f hisaboo-github-ready-v1.2.zip
          rm -f .github/workflows/extract.yml
          echo "--- files ---"
          find . -path ./.git -prune -o -type f -print | sort
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Hisaboo v1.2 source" || echo "nothing to commit"
          git push
