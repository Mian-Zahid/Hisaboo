name: Extract Hisaboo source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: |
          unzip -o hisaboo-source-v1.0-fixed.zip
          rm -f hisaboo-source-v1.0-fixed.zip
          rm -f .github/workflows/extract.yml
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply 9 fixes + text polish (v1.0)" || echo "nothing to commit"
          git push
