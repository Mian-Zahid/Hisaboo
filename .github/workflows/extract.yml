name: Extract Hisaboo source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout karo
        uses: actions/checkout@v4

      - name: Zip kholo
        run: |
          rm -rf app
          unzip -o hisaboo-source-v1.0-fixed.zip
          rm hisaboo-source-v1.0-fixed.zip

      - name: Commit karo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Extract Hisaboo source v1.0" || echo "nothing to commit"
          git push
