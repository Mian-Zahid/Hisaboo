# Hisaboo — GitHub Actions se APK banao (ek button, koi error nahi)
#
# Ye workflow GitHub ke free server pe APK banata hai. Tumhe apne phone/computer
# pe Android Studio, Java ya Gradle install karne ki zaroorat NAHI.
# Bas repo me ye files daalo, Actions > Run workflow dabao, APK Artifacts se download karo.

name: Build Hisaboo APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout karo
        uses: actions/checkout@v4

      - name: Java 17 set karo
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 install karo
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Android SDK 34 ready karo
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Debug APK banao
        run: gradle assembleDebug --stacktrace

      - name: APK upload karo (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Hisaboo-v1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
